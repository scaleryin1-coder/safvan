<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>JOBit - Hyperlocal Worker Booking</title>
    <meta name="description" content="Mobile-first hyperlocal on-demand service and blue-collar worker booking app with real-time GPS matching, Swiggy-style live job tracking, and instant call/WhatsApp." />
    <meta property="og:title" content="JOBit - Hyperlocal Worker Booking" />
    <meta property="og:description" content="Mobile-first hyperlocal on-demand service and blue-collar worker booking app with real-time GPS matching, Swiggy-style live job tracking, and instant call/WhatsApp." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#DC2626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JOBit" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Plus Jakarta Sans / Inter font for crisp mobile app feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-stone-100 text-stone-900 select-none antialiased overflow-x-hidden font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && !window.location.host.includes('localhost:5173')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
